  Clesson\Silverstripe\HouseholdBudget\Models\HouseholdBudget:
    SINGULARNAME: 'Haushaltsbudget'
    PLURALNAME: 'Haushaltsbudgets'
    TITLE: 'Titel'
    DASHBOARD: 'Dashboard'
    ENTRIES: 'Buchungen'
    MONTHLY_DETAILS: 'Monatsdetails'
    MONTHLY_DETAILS_HINT_TITLE: 'So nutzt du die Monatsdetails'
    MONTHLY_DETAILS_HINT: 'Hier siehst du die geplanten Einnahmen, Ausgaben und den Saldo eines Monats. Wähle Jahr, Monat und die einzubeziehenden Konten aus; die Ansicht aktualisiert sich automatisch. Einnahmen und Ausgaben werden getrennt mit ihren Summen aufgelistet. Umbuchungen werden separat angezeigt und beeinflussen den Saldo nicht. Die Angaben beruhen auf deinen Planbuchungen, nicht auf tatsächlichen Kontobewegungen oder Kontoständen. Buchungen kannst du unter Administration → Buchungen hinzufügen oder bearbeiten.'
    REPORT: 'Bericht / PDF'
    REPORT_HINT_TITLE: 'So erstellst du einen Haushaltsbericht'
    REPORT_HINT: 'Erstelle eine PDF-Übersicht über Einnahmen, Haushaltskosten, Saldo, Monatsentwicklung und Kostenarten. Wähle einen Start- und Endmonat; beide Monate werden einbezogen, auch über Jahresgrenzen hinweg. Wähle anschließend mindestens eines deiner verknüpften Konten aus und klicke auf „Haushaltsbericht herunterladen“. Anfangs sind alle Konten ausgewählt. Die PDF-Datei wird direkt heruntergeladen; das CMS-Formular musst du dafür nicht speichern. Umbuchungen werden separat ausgewiesen und beeinflussen weder Kosten noch Saldo. Grundlage sind die aktuell erfassten Planbuchungen – auch für vergangene Zeiträume –, nicht tatsächliche Kontobewegungen oder Kontostände.'
    FORECAST_EMAILS_ENABLED: 'Monatliche Prognose-E-Mails aktivieren'
    COMBINED_FORECAST_EMAIL_ENABLED: 'Eine Prognose für alle eigenen Konten senden'
    ADMINISTRATION: 'Administration'
    SETTINGS: 'Einstellungen'
    ENTRIES_HINT_TITLE: 'So verwaltest du deine Planbuchungen'
    ENTRIES_HINT: 'Erstelle oder bearbeite hier deine Planbuchungen. Gib eine aussagekräftige Bezeichnung, einen positiven Betrag, die Buchungsart und dein Bankkonto an; die Gegenpartei ist optional. Wähle alle Monate aus, in denen der Betrag anfällt. Mit einem optionalen Beginn und Ende begrenzt du die Wiederholung; beide Grenzmonate werden einbezogen. Über die Schaltflächen für die Buchungsarten filterst du die Liste. Die Monatssymbole zeigen die ausgewählten Wiederholungsmonate; optionale Zeitgrenzen gelten weiterhin. Die Vergleichsbalken setzen jeden Betrag ins Verhältnis zum höchsten Betrag seiner Gruppe. Einnahmen sind grün, Ausgaben rot und Umbuchungen blau. Umbuchungen beeinflussen weder Kosten noch Saldo. Speichere jede Buchung nach dem Bearbeiten.'
    SETTINGS_HINT_TITLE: 'So konfigurierst du die monatlichen Prognose-E-Mails'
    SETTINGS_HINT: 'Aktiviere die monatlichen Prognose-E-Mails mit dem Hauptschalter und wähle anschließend die Konten aus, für die du jeweils eine eigene E-Mail erhalten möchtest. Zusätzlich kannst du unabhängig von dieser Auswahl eine Gesamtprognose für alle verknüpften Konten aktivieren. Alle E-Mails gehen ausschließlich an die Adresse in deinem Benutzerkonto und enthalten eine passende PDF-Datei. Speichere das CMS-Formular, um deine Einstellungen zu übernehmen. Wenn du den Hauptschalter ausschaltest, pausiert der gesamte Versand; deine Auswahl bleibt erhalten. Bei eingerichtetem und laufendem technischem Task erfolgt der Versand ausschließlich am letzten Kalendertag in der Anwendungszeitzone für den nächsten Monat; ein späterer Nachversand findet nicht statt. Die Prognosen beruhen auf deinen aktuellen Planbuchungen, nicht auf tatsächlichen Kontoständen. Die Versandübersicht darunter zeigt die letzten Ergebnisse; eine angenommene E-Mail ist keine Zustellgarantie, und unklare Versandversuche werden nicht automatisch wiederholt.'
    EMAIL_FORECASTS: 'E-Mail-Prognosen'
    SIGN_IN_REQUIRED: 'Du musst angemeldet sein.'
    OWNER_REQUIRED: 'Ein Haushaltsbudget benötigt einen Eigentümer.'

