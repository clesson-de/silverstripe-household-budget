  Clesson\Silverstripe\HouseholdBudget\Models\HouseholdBudget:
    SINGULARNAME: 'Household budget'
    PLURALNAME: 'Household budgets'
    TITLE: 'Title'
    DASHBOARD: 'Dashboard'
    ENTRIES: 'Budget entries'
    MONTHLY_DETAILS: 'Monthly details'
    MONTHLY_DETAILS_HINT_TITLE: 'Using the monthly details'
    MONTHLY_DETAILS_HINT: 'Review the planned income, expenses and balance for one month. Select a year, month and the accounts to include; the view updates automatically. Income and expenses are listed separately with their totals. Transfers are shown separately and do not affect the balance. These are planned bookings, not actual account transactions or balances. To add or change bookings, open Administration → Budget entries.'
    REPORT: 'Report / PDF'
    REPORT_HINT_TITLE: 'Creating a household report'
    REPORT_HINT: 'Create a PDF overview of income, household costs, balance, monthly development and cost categories. Select a start and end month; both months are included, and the period may span multiple years. Then select at least one of your linked accounts and click "Download household report". All accounts are initially selected. The PDF is downloaded directly; you do not need to save the CMS form. Transfers are shown separately and do not affect costs or balance. Reports use the currently recorded planned bookings, including for past periods, not actual bank transactions or account balances.'
    FORECAST_EMAILS_ENABLED: 'Enable monthly forecast emails'
    COMBINED_FORECAST_EMAIL_ENABLED: 'Send one forecast for all my accounts'
    ADMINISTRATION: 'Administration'
    SETTINGS: 'Settings'
    ENTRIES_HINT_TITLE: 'Managing your planned bookings'
    ENTRIES_HINT: 'Create or edit your planned bookings here. Enter a clear description, a positive amount, the booking type and your bank account; a counterparty is optional. Select every month in which the amount occurs. Optional start and end months limit the recurrence, including both boundary months. Use the type buttons to filter the list. The month icons show selected recurring months; optional date limits still apply. The comparison bars show each amount relative to the largest amount in its group. Income is green, expenses red and transfers blue. Transfers do not affect costs or balance. Save each booking after editing.'
    SETTINGS_HINT_TITLE: 'Configuring monthly forecast emails'
    SETTINGS_HINT: 'Enable monthly forecast emails with the main switch, then select the accounts for which you want a separate email. You can also enable an additional forecast for all your linked accounts, independently of the individual selections. All emails go only to the email address in your user account and include a matching PDF. Save the CMS form to apply your settings. Turning off the main switch pauses all emails without clearing your selections. When the technical task is configured and running, emails are sent only on the last calendar day in the application time zone and describe the next month; there is no later catch-up. Forecasts use your current planned bookings, not actual account balances. The delivery overview below shows recent results; an accepted email is not a guarantee of delivery, and uncertain attempts are not retried automatically.'
    EMAIL_FORECASTS: 'Email forecasts'
    SIGN_IN_REQUIRED: 'You must be signed in.'
    OWNER_REQUIRED: 'A household budget requires an owner.'

